name: kitobho
description: Китобҳои мактабӣ — як код, 11 барнома (синфи 1–11).
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdfrx: ^2.2.18
  google_mobile_ads: ^9.1.0
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  wakelock_plus: ^1.3.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  default-flavor: sinf4
  assets:
    - assets/covers/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/logosinfi4.png
  adaptive_icon_background: "#1B5E3B"
  adaptive_icon_foreground: assets/branding/logosinfi4.png
  min_sdk_android: 24
  remove_alpha_ios: true
